name: Yahoo dead-ticker probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yahoo_dead_probe.py'
      - '.github/workflows/yahoo-dead-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yfinance pandas
      - run: python yahoo_dead_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-dead-probe
          path: yahoo_dead_probe_report.json
          if-no-files-found: warn
