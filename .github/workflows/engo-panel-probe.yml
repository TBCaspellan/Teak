name: Engo panel endpoint probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/engo-panel-probe.yml'
      - 'engo_panel_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - run: python engo_panel_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engo-panel-probe
          path: engo_panel_probe.json
          if-no-files-found: warn
