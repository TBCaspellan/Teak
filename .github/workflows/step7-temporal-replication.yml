name: Step 7 frozen temporal replication
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step7-temporal-replication.yml'
      - 'step7_temporal_replication.py'
permissions:
  contents: read
  actions: read
jobs:
  freeze-multi-period-features:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SEC_EDGAR_DUCKDB: cache/sec/sec_edgar.duckdb
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove frozen formula/data engine unchanged since Step 6
        run: |
          git diff --exit-code c781f4e66a4d81636b3f3a4e998743b056cb577a -- \
            config_open_core.py open_core_runtime.py open_core_engine.py fsd_quarterly.py engo_provider.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow duckdb requests huggingface_hub hf_xet
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - uses: actions/cache@v4
        id: sec-cache
        with:
          path: cache/sec/sec_edgar.duckdb
          key: sec-edgar-duckdb-20260808-v1
      - name: Bootstrap local SEC DuckDB only on cache miss
        if: steps.sec-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cache/sec
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(repo_id='erlenbusch/sec-edgar',repo_type='dataset',filename='sec_edgar.duckdb',local_dir='cache/sec'))
          PY
          test -s "$SEC_EDGAR_DUCKDB"
      - name: Download frozen historical identity panel
        run: |
          mkdir -p identity
          gh api /repos/${{ github.repository }}/actions/artifacts/9014898518/zip > identity.zip
          unzip -q identity.zip -d identity
          test -f identity/universe_identity_panel.parquet
      - name: Download frozen official FF48 map
        run: |
          mkdir -p ff48
          gh api /repos/${{ github.repository }}/actions/artifacts/9014929943/zip > ff48.zip
          unzip -q ff48.zip -d ff48
          test -f ff48/ff48_sic_map.parquet
      - name: Build all predeclared historical feature snapshots before outcome analysis
        run: python step7_temporal_replication.py build-features
      - name: Upload frozen Step 7 feature artifact
        uses: actions/upload-artifact@v4
        with:
          name: step7-frozen-multi-period-features
          path: step7_features/
          if-no-files-found: error

  temporal-replication:
    needs: freeze-multi-period-features
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Re-prove frozen formula/data engine unchanged since Step 6
        run: |
          git diff --exit-code c781f4e66a4d81636b3f3a4e998743b056cb577a -- \
            config_open_core.py open_core_runtime.py open_core_engine.py fsd_quarterly.py engo_provider.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Download frozen feature artifact created before outcomes
        uses: actions/download-artifact@v4
        with:
          name: step7-frozen-multi-period-features
          path: step7_features
      - name: Run predeclared temporal replication; 2020 excluded from primary inference
        run: python step7_temporal_replication.py replicate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7-temporal-replication-results
          path: step7_temporal_replication/
          if-no-files-found: warn
