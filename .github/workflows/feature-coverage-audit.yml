name: OPEN-Core remote SEC transport diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow duckdb requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Diagnostic only - remote SEC transport is not the production gate
        run: echo 'This workflow tests the remote SEC/Hugging Face transport only. feature-coverage-local-sec.yml is the canonical production pre-outcome gate.'
      - name: Download frozen Form345 identity universe
        run: |
          mkdir -p identity
          gh api /repos/${{ github.repository }}/actions/artifacts/9014898518/zip > identity.zip
          unzip -q identity.zip -d identity
          test -f identity/universe_identity_panel.parquet
      - name: Download frozen official FF48 map
        run: |
          mkdir -p ff48
          gh api /repos/${{ github.repository }}/actions/artifacts/9014929943/zip > ff48.zip
          unzip -q ff48.zip -d ff48
          test -f ff48/ff48_sic_map.parquet
      - name: Run remote transport diagnostic; no forward outcomes
        run: python feature_coverage_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-core-remote-sec-transport-diagnostic
          path: feature_coverage_audit/
          if-no-files-found: warn
