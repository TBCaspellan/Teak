name: OPEN-Core pre-outcome feature coverage audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/feature-coverage-audit.yml'
      - 'feature_coverage_audit.py'
      - 'open_core_engine.py'
      - 'open_core_runtime.py'
      - 'fsd_quarterly.py'
      - 'engo_provider.py'
      - 'config_open_core.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow duckdb requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Download frozen Form345 identity universe
        run: |
          mkdir -p identity
          gh api /repos/${{ github.repository }}/actions/artifacts/9014898518/zip > identity.zip
          unzip -q identity.zip -d identity
          test -f identity/universe_identity_panel.parquet
      - name: Download frozen official FF48 map
        run: |
          mkdir -p ff48
          gh api /repos/${{ github.repository }}/actions/artifacts/9014929943/zip > ff48.zip
          unzip -q ff48.zip -d ff48
          test -f ff48/ff48_sic_map.parquet
      - name: Build features only on current head; no forward outcomes
        run: python feature_coverage_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-core-feature-coverage-audit
          path: feature_coverage_audit/
          if-no-files-found: warn
