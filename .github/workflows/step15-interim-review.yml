name: Step 15 prospective interim review setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'step15_interim_review_protocol.json'
      - 'step15_interim_review.py'
      - '.github/workflows/step15-interim-review.yml'
permissions:
  contents: read
jobs:
  interim-review-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove frozen formula/data engine unchanged
        run: |
          git diff --exit-code c781f4e66a4d81636b3f3a4e998743b056cb577a -- \
            config_open_core.py open_core_runtime.py open_core_engine.py fsd_quarterly.py engo_provider.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate interim-review protocol without loading alpha tables
        run: python step15_interim_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: step15-interim-review-setup
          path: step15_interim_review/
