name: OPEN-Core canonical pre-outcome production gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/feature-coverage-local-sec.yml'
      - 'feature_coverage_audit_local.py'
      - 'sec_local_mirror.py'
      - 'engo_provider.py'
      - 'fsd_quarterly.py'
      - 'open_core_runtime.py'
      - 'open_core_engine.py'
      - 'config_open_core.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SEC_EDGAR_DUCKDB: cache/sec/sec_edgar.duckdb
      ENGO_WORKERS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow duckdb requests huggingface_hub hf_xet
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Restore canonical local SEC database cache
        uses: actions/cache@v4
        id: sec-cache
        with:
          path: cache/sec/sec_edgar.duckdb
          key: sec-edgar-duckdb-20260808-v1
      - name: Bootstrap local SEC DuckDB only on cache miss
        if: steps.sec-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cache/sec
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(repo_id='erlenbusch/sec-edgar',repo_type='dataset',filename='sec_edgar.duckdb',local_dir='cache/sec')
          print(p)
          PY
          test -f cache/sec/sec_edgar.duckdb
      - name: Verify local SEC database before feature construction
        run: test -s "$SEC_EDGAR_DUCKDB"
      - name: Download frozen Form345 identity universe
        run: |
          mkdir -p identity
          gh api /repos/${{ github.repository }}/actions/artifacts/9014898518/zip > identity.zip
          unzip -q identity.zip -d identity
          test -f identity/universe_identity_panel.parquet
      - name: Download frozen official FF48 map
        run: |
          mkdir -p ff48
          gh api /repos/${{ github.repository }}/actions/artifacts/9014929943/zip > ff48.zip
          unzip -q ff48.zip -d ff48
          test -f ff48/ff48_sic_map.parquet
      - name: Run canonical integrated feature gate; no forward outcomes
        run: python feature_coverage_audit_local.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-core-canonical-pre-outcome-gate
          path: feature_coverage_audit_local/
          if-no-files-found: warn
