name: HuggingFace historical-price probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'hf_price_probe.py'
      - '.github/workflows/hf-price-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb pandas pyarrow
      - run: python hf_price_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-price-probe
          path: hf_price_probe_report.json
