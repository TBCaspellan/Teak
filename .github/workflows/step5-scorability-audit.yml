name: Step 5 pre-outcome scorability blocker audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step5-scorability-audit.yml'
      - 'step5_scorability_audit.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas pyarrow numpy
      - name: Download frozen Step 4 local-SEC production artifact
        run: |
          mkdir -p step4_artifact
          gh api /repos/${{ github.repository }}/actions/artifacts/9016699546/zip > step4.zip
          unzip -q step4.zip -d step4_artifact
          test -f step4_artifact/feature_coverage_report.json
          test -f step4_artifact/raw_features.parquet
          test -f step4_artifact/scored_features.parquet
      - name: Audit scorability blockers without outcomes
        run: python step5_scorability_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step5-pre-outcome-scorability-audit
          path: step5_scorability_audit/
          if-no-files-found: warn
