name: Validate Engo survivorship-safe prices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/engo-validate.yml'
      - 'validate_engo.py'
      - 'engo_provider.py'
      - 'trigger_engo_validation.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow requests
      - name: Require ENGO secret
        run: test -n "$ENGO_API_KEY" || (echo 'Set repository secret ENGO_API_KEY first' && exit 2)
      - run: python validate_engo.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engo-validation
          path: engo_validation.json
          if-no-files-found: warn
