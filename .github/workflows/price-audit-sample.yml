name: OPEN sampled price-liquidity audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/price-audit-sample.yml'
      - 'price_audit_sample.py'

permissions:
  contents: read
  actions: read

jobs:
  price-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Download frozen identity-universe artifact
        run: |
          mkdir -p identity
          gh api /repos/${{ github.repository }}/actions/artifacts/9014643458/zip > identity.zip
          unzip -q identity.zip -d identity
          test -f identity/universe_identity_panel.parquet
      - run: python price_audit_sample.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-price-audit-sample
          path: price_audit_sample/
          if-no-files-found: warn
