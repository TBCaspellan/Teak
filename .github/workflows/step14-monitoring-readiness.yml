name: Step 14 prospective monitoring readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'step14_monitoring_readiness.py'
      - '.github/workflows/step14-monitoring-readiness.yml'
permissions:
  contents: read
jobs:
  monitoring-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove frozen formula/data engine unchanged
        run: |
          git diff --exit-code c781f4e66a4d81636b3f3a4e998743b056cb577a -- \
            config_open_core.py open_core_runtime.py open_core_engine.py fsd_quarterly.py engo_provider.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas
      - name: Audit monitoring readiness without alpha access
        run: python step14_monitoring_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: step14-monitoring-readiness
          path: step14_monitoring_readiness/
