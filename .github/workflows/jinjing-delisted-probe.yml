name: JinJing delisted-price probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'jinjing_delisted_probe.py'
      - '.github/workflows/jinjing-delisted-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb pandas pyarrow
      - run: python jinjing_delisted_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jinjing-delisted-probe
          path: jinjing_delisted_probe_report.json
          if-no-files-found: warn
