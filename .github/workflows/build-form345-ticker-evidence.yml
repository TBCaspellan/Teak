name: Build historical Form 3/4/5 ticker evidence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-form345-ticker-evidence.yml'
      - 'build_form345_ticker_evidence.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb huggingface_hub
      - run: python build_form345_ticker_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-form345-ticker-evidence
          path: |
            historical_ticker_evidence_form345.parquet
            form345_ticker_evidence_report.json
