name: Build historical Form 3/4/5 ticker evidence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-form345-ticker-evidence.yml'
      - 'build_form345_ticker_evidence.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb huggingface_hub
      - name: Download frozen Form 4 evidence
        run: |
          mkdir -p form4
          gh api /repos/${{ github.repository }}/actions/artifacts/9014337819/zip > form4.zip
          unzip -q form4.zip -d form4
          test -f form4/historical_ticker_evidence_form4.parquet
      - run: python build_form345_ticker_evidence.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-form345-ticker-evidence
          path: |
            historical_ticker_evidence_form345.parquet
            form345_ticker_evidence_report.json
          if-no-files-found: warn
