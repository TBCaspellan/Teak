name: Step 10 frozen evidence analysis repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step10-analysis-repair.yml'
permissions:
  contents: read
  actions: read
jobs:
  complete-evidence-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ENGO_API_KEY: ${{ secrets.ENGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      STEP10_FEATURE_ARTIFACT_ID: '9024839933'
      STEP10_FEATURE_ARTIFACT_SHA256: '0adddea042821e3225ebddf833917739f7ff3997dbd71403bf8772cfccf00d4c'
      STEP7_RESULTS_ARTIFACT_ID: '9018382581'
      STEP7_RESULTS_ARTIFACT_SHA256: '5855c46700b4849e6ecbcb4c57d68df5aa8213459a4f9d9a8f88ac600442201e'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prove frozen formula/data engine unchanged since Step 6
        run: |
          git diff --exit-code c781f4e66a4d81636b3f3a4e998743b056cb577a -- \
            config_open_core.py open_core_runtime.py open_core_engine.py fsd_quarterly.py engo_provider.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pyarrow requests
      - run: test -n "$ENGO_API_KEY" || (echo 'ENGO_API_KEY missing' && exit 2)
      - name: Restore exact successful Step 10 holdout feature artifact
        run: |
          mkdir -p step10_features
          gh api /repos/${{ github.repository }}/actions/artifacts/${STEP10_FEATURE_ARTIFACT_ID}/zip > step10_features.zip
          echo "${STEP10_FEATURE_ARTIFACT_SHA256}  step10_features.zip" | sha256sum -c -
          unzip -q step10_features.zip -d step10_features
          test -f step10_features/scored_snapshots.parquet
          test -f step10_features/step10_feature_manifest.json
      - name: Restore exact frozen Step 7 replication evidence
        run: |
          mkdir -p frozen_step7_results
          gh api /repos/${{ github.repository }}/actions/artifacts/${STEP7_RESULTS_ARTIFACT_ID}/zip > step7_results.zip
          echo "${STEP7_RESULTS_ARTIFACT_SHA256}  step7_results.zip" | sha256sum -c -
          unzip -q step7_results.zip -d frozen_step7_results
          test -f frozen_step7_results/period_level_ic.csv
      - name: Verify period IC schemas before evidence accumulation
        run: |
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('frozen_step7_results/period_level_ic.csv')
          assert {'score','horizon_sessions','signal_date','spearman_ic'} <= set(p.columns), p.columns.tolist()
          print('Frozen Step 7 period IC schema verified: spearman_ic')
          PY
      - name: Complete frozen Step 10 evidence accumulation; no optimization
        run: python step10_evidence_accumulation.py accumulate
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step10-completed-independent-evidence
          path: step10_evidence_accumulation/
          if-no-files-found: warn
