name: OPEN-Core invariant tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/open-core-tests.yml'
      - 'open_core_engine.py'
      - 'open_core_runtime.py'
      - 'config_open_core.py'
      - 'tests/test_open_core_runtime.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy pandas pytest
      - run: python -m pytest -q tests/test_open_core_runtime.py
